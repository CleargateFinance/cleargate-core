name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build all packages
        run: go build ./...

      - name: Vet (static analysis)
        run: go vet ./...

      - name: Run unit tests
        run: go test ./internal/... -race -count=1

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # ./... rather than ./test/..., since integration-tagged tests are
      # co-located with the code they test (e.g. internal/infrastructure/database),
      # not centralized under test/. This runner has Docker preinstalled, so
      # testcontainers-go spins up the same Postgres/Redis containers used locally.
      - name: Run integration tests (spins real Postgres + Redis via testcontainers)
        run: go test ./... -race -count=1 -tags=integration

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7

  # Task 9.1: the one image every role runs from. It is built for linux/arm64,
  # the Fargate target, and run here under QEMU, so the artifact tested is the
  # architecture that ships. It is not pushed: deploying is Task 13.9's job.
  image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cleargate
          POSTGRES_PASSWORD: cleargate
          POSTGRES_DB: cleargate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cleargate"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU, to run the arm64 image on an x86 runner
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        run: make image IMAGE=cleargate-core GIT_SHA=${{ github.sha }}

      # migrate needs only DATABASE_DSN (config.LoadMigrate). Running up and
      # then version proves the migrations are inside the image and apply.
      - name: Apply the migrations from the image
        env:
          DATABASE_DSN: postgres://cleargate:cleargate@localhost:5432/cleargate?sslmode=disable
        run: |
          docker run --rm --network host -e DATABASE_DSN cleargate-core:${{ github.sha }} /migrate up
          docker run --rm --network host -e DATABASE_DSN cleargate-core:${{ github.sha }} /migrate version

  # demo/ is its own Go module, which ./... from the root never reaches, so it
  # is built, tested and linted in a job of its own.
  demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: demo/go.sum

      - name: Build and vet
        run: go build ./... && go vet ./...

      - name: Run unit tests
        run: go test ./... -race -count=1

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          working-directory: demo
