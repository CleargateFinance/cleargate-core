# Local development dependencies only. Production runs elsewhere.
#
# Postgres is on its default port, 5432, so stop any Postgres already running on
# the machine first. Redis is on 6380 rather than 6379 so it does not collide
# with one already installed. Inside the containers both listen on their normal
# ports.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cleargate
      POSTGRES_PASSWORD: cleargate
      POSTGRES_DB: cleargate
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleargate"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
